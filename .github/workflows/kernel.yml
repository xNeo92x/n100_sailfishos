name: Build experimental kernel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel, device trees and modules
        run: python3 tools/build-kernel.py --work-dir "$RUNNER_TEMP/n100-kernel" --jobs 4
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: ${{ runner.temp }}/n100-kernel/kernel-config-output/*.log
          if-no-files-found: ignore
      - name: Save experimental outputs
        uses: actions/upload-artifact@v4
        with:
          name: billie2-experimental-kernel-not-flashable
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/n100-kernel/kernel-config-output/build-result.json
            ${{ runner.temp }}/n100-kernel/kernel-config-output/.config
            ${{ runner.temp }}/n100-kernel/kernel-config-output/arch/arm64/boot/Image
            ${{ runner.temp }}/n100-kernel/kernel-config-output/arch/arm64/boot/dts/vendor/billie2/*.dtb*
            ${{ runner.temp }}/n100-kernel/kernel-config-output/billie2-merged-check.dtb
            ${{ runner.temp }}/n100-kernel/kernel-config-output/**/*.ko
          if-no-files-found: error
          retention-days: 30
