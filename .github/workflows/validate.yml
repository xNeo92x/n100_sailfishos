name: Validate port tooling
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python host tests
        run: python3 -m unittest discover -s tests -v
      - name: Upstream fs_config Python 3 tests
        run: python3 -m unittest discover -s compat/fs_config_generator -p 'test_*.py' -v
      - name: Shell syntax
        run: bash -n tools/build-hal.sh tools/build-packages.sh tools/build-linker-inputs.sh tools/build-linker-providers.sh tools/build-native-runtime.sh tools/build-graphics-runtime.sh tools/probe-android-mounts.sh tools/runtime-probe.sh.in tools/runtime-rpm-probe.sh.in tools/native-namespace-probe.sh.in tools/vendor-dependency-probe.sh.in tools/run-graphics-build.sh tools/run-vendor-v3-probe.sh tools/run-hal-rpm-build.sh tools/run-selinux-rpm-build.sh tools/run-runtime-v4-probe.sh tools/run-runtime-v5-probe.sh tools/run-service-tool-build.sh tools/run-runtime-v6-probe.sh tools/run-preload-rpm-build.sh adaptation/rpm/helpers/install-android-runtime.sh adaptation/droid-configs/kickstart/pack_package-droid-updater adaptation/initramfs/usb-configfs.sh adaptation/initramfs/early-debug.sh
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
      - name: Whitespace
        run: git diff --check
